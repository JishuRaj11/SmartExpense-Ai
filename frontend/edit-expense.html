<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Expense | SmartExpenses AI</title>
  <link rel="stylesheet" href="css/style.css?v=4" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%234f46e5'/%3E%3Cpath d='M5 15h14M5 10h9' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>

<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="nav-overlay" id="navOverlay"></div>

  <div class="main">
    <!-- ---------------- Header ---------------- -->
    <header class="topbar">
      <button class="hamburger" id="menuToggle" aria-label="Open navigation menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>

      <img class="topbar-logo" src="assets/logo.svg" alt="" width="40" height="40" />

      <div>
        <h1>Edit Expense</h1>
        <div class="page-sub">Update the details of this expense</div>
      </div>

      <div class="topbar-right">
        <span class="avatar" data-user-avatar>U</span>
      </div>
    </header>

    <!-- ---------------- Form ---------------- -->
    <main class="page">
      <div class="page-head">
        <h2>Edit Expense</h2>
        <p id="editSubtitle">Loading the expense details...</p>
      </div>

      <div class="grid-2">
        <section class="card">
          <div class="card-head">
            <h3>Expense Details</h3>
            <span class="hint" id="expenseIdChip"></span>
          </div>
          <div class="card-body">
            <div class="form-alert" id="formAlert" role="alert" aria-live="polite"></div>

            <!-- Loading state while GET /expenses/{id} is in flight -->
            <div id="formLoader">
              <div class="loading-overlay">
                <span class="spinner dark"></span>
                <span>Loading expense...</span>
              </div>
            </div>

            <form id="expenseForm" novalidate hidden>
              <div class="form-grid">
                <!-- Title -->
                <div class="field full">
                  <label for="title">Title <span class="req">*</span></label>
                  <input
                    class="input"
                    type="text"
                    id="title"
                    name="title"
                    placeholder="e.g. Groceries at BigBasket"
                    maxlength="120"
                    required
                  />
                  <span class="field-error" id="titleError"></span>
                </div>

                <!-- Amount -->
                <div class="field">
                  <label for="amount">Amount <span class="req">*</span></label>
                  <div class="input-affix">
                    <span class="prefix" id="currencyPrefix">&#8377;</span>
                    <input
                      class="input"
                      type="number"
                      id="amount"
                      name="amount"
                      placeholder="0.00"
                      step="0.01"
                      min="0.01"
                      inputmode="decimal"
                      required
                    />
                  </div>
                  <span class="field-error" id="amountError"></span>
                </div>

                <!-- Date -->
                <div class="field">
                  <label for="date">Date <span class="req">*</span></label>
                  <input class="input" type="date" id="date" name="date" required />
                  <span class="field-error" id="dateError"></span>
                </div>

                <!-- Category -->
                <div class="field full">
                  <span class="field-label">Category <span class="req">*</span></span>
                  <div class="category-picker" id="categoryPicker" role="radiogroup" aria-label="Category"></div>
                  <span class="field-error" id="categoryError"></span>
                </div>
              </div>

              <div class="form-actions">
                <button class="btn btn-primary btn-lg" type="submit" id="submitButton">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m5 13 4 4L19 7" />
                  </svg>
                  <span>Save Changes</span>
                </button>
                <a class="btn btn-secondary btn-lg" href="expenses.html">Cancel</a>
                <button class="btn btn-danger-soft btn-lg" type="button" id="deleteButton">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                  </svg>
                  <span>Delete</span>
                </button>
              </div>
            </form>
          </div>
        </section>

        <!-- Live preview -->
        <aside class="card">
          <div class="card-head">
            <h3>Preview</h3>
          </div>
          <div class="card-body">
            <div class="text-xs text-muted">Total amount</div>
            <div class="stat-value" id="previewAmount">&#8377;0.00</div>

            <div style="height:1px;background:var(--line);margin:18px 0;"></div>

            <div class="text-xs text-muted">Category</div>
            <div class="fw-700" id="previewCategory" style="margin-top:4px;">Not selected</div>

            <div class="text-xs text-muted" style="margin-top:16px;">Date</div>
            <div class="fw-700" id="previewDate" style="margin-top:4px;">Not selected</div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js?v=4"></script>
  <script src="js/expense-form.js"></script>
  <script src="js/edit-expense.js"></script>
</body>
</html>
